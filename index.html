<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ask Gemini</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Ask Gemini</h1>

        <p class="subtitle">
            Ask anything and get an AI-powered answer.
        </p>

        <form id="askForm">

            <textarea
                id="question"
                placeholder="Ask your question..."
                rows="5"
            ></textarea>

            <button id="askButton" type="submit">
                Ask Gemini
            </button>

        </form>

        <section class="answer-section">

            <h2>Answer</h2>

            <div id="answer">
                Your answer will appear here.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
